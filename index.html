<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<meta name="robots" content="noindex, nofollow">
<title>류씨가족 일본여행</title>
<style>
:root{
  --bg:#f6f4f1;--card:#fff;--ink:#1d1b19;--sub:#6b665f;--line:#e6e1da;
  --accent:#c8102e;--accent-soft:#fbe9ec;--ok:#2f7d4f;--warn:#a46a00;--warn-soft:#fff4dc;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141312;--card:#1f1d1b;--ink:#f1eee9;--sub:#a59f97;--line:#34302c;
    --accent:#ff5a6e;--accent-soft:#3a1d22;--ok:#6fcf97;--warn:#f2c35b;--warn-soft:#3a2f17;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.5}
a{color:var(--accent)}
header{position:relative;overflow:hidden;color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 0;
  background:linear-gradient(180deg,#1b2a4a 0%,#7a3b5e 55%,#e2725b 100%);min-height:230px}
header .txt{position:relative;z-index:2}
header .kicker{font-size:12px;letter-spacing:3px;opacity:.85;font-weight:700}
header h1{margin:4px 0 0;font-size:30px;letter-spacing:-.5px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.25)}
header p{margin:6px 0 0;font-size:13px;opacity:.92}
#dday{display:inline-block;margin-top:10px;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);padding:5px 12px;border-radius:99px;font-size:14px;font-weight:800}
header svg{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:auto;z-index:1;display:block}
nav{position:sticky;top:0;z-index:5;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1 0 auto;border:0;background:none;padding:13px 7px;font-size:13px;white-space:nowrap;letter-spacing:-.4px;color:var(--sub);font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--accent);border-color:var(--accent)}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px}
.row{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.row+.row{border-top:1px dashed var(--line)}
.k{min-width:52px;color:var(--sub);font-size:13px;padding-top:1px}
.v{flex:1;font-size:15px}
.flight{display:flex;align-items:center;justify-content:space-between;gap:8px}
.flight b{font-size:20px}
.flight .mid{flex:1;text-align:center;color:var(--sub);font-size:12px}
.flight .mid:before{content:"";display:block;border-top:1px solid var(--line);margin:0 0 4px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin:2px 4px 0 0;font-weight:600}
.day{border-left:4px solid var(--line)}
.day.today{border-left-color:var(--accent)}
.day .head{display:flex;justify-content:space-between;align-items:baseline}
.day .head{gap:8px}.day .head span{color:var(--sub);font-size:13px;white-space:nowrap}
.item{display:flex;gap:10px;padding:7px 0;font-size:15px}
.item .t{min-width:46px;font-variant-numeric:tabular-nums;font-weight:700}
.item.pending{color:var(--warn)}
.item.pending .t:before{content:"?";}
.item.sub{color:var(--sub);font-size:13px}
.meals{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--sub)}
.spot{padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.spot+.spot{border-top:1px dashed var(--line)}
.spot .nm{font-weight:700;font-size:15px}
.spot .wh{font-size:13px;color:var(--sub)}
.spot a.map{flex:none;font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);background:var(--bg)}
.steps-tf p{margin:6px 0;font-size:14px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;background:var(--bg);color:var(--ink)}
.addrow button{border:0;border-radius:10px;padding:0 14px;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
.del{margin-left:auto;border:0;background:none;color:var(--sub);font-size:18px}
.wx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.wx div{background:var(--bg);border-radius:10px;padding:8px 2px;font-size:12px;color:var(--sub)}
.wx b{display:block;font-size:22px;margin:2px 0}
.wx .t{color:var(--ink);font-weight:700;font-size:13px}
.fx{display:flex;gap:8px;align-items:center}
.fx input,.fx select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:17px;background:var(--bg);color:var(--ink)}
.fx span{flex:none;font-weight:700;width:22px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:5px 10px;font-size:13px}
.ledger{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.ledger td{padding:7px 2px;border-top:1px dashed var(--line)}
.ledger td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.em a{display:flex;justify-content:space-between;align-items:center;padding:10px 0;text-decoration:none;color:var(--ink);border-top:1px dashed var(--line)}
.em a:first-of-type{border-top:0}
.em a{gap:10px}.em a b{color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.ph{padding:10px 0;border-top:1px dashed var(--line);cursor:pointer}
.ph:first-of-type{border-top:0}
.ph .ko{font-size:13px;color:var(--sub)}
.ph .ja{font-size:19px;font-weight:700}
.ph .rd{font-size:12px;color:var(--sub)}
#big{position:fixed;inset:0;z-index:20;background:var(--card);display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
#big.on{display:flex}
#big .ja{font-size:40px;font-weight:800;line-height:1.3}
#big .ko{margin-top:16px;color:var(--sub);font-size:16px}
.tipl{margin:0;padding-left:18px;font-size:14px}.tipl li{margin:4px 0}
.nowrow{display:flex;align-items:center;gap:14px}
.nowrow .big{font-size:34px;font-weight:800;white-space:nowrap}
.nowrow .nm{font-weight:700}
.hh{display:flex;gap:8px;margin-top:10px}
.hh div{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.hh span{display:block;font-size:12px;color:var(--sub)}
.hh b{font-size:20px}
.wx small{font-size:11px;color:var(--sub)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:99px;font-size:14px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ghead{font-size:15px;margin:18px 2px 8px;display:flex;align-items:center;gap:6px}.ghead span{font-size:12px;color:var(--sub);font-weight:600}
.link .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff}
.b-instagram{background:#d62976}.b-youtube{background:#e00}.b-blog{background:#03a94d}.b-chatgpt{background:#10a37f}.b-web{background:#666}
.link .meta{font-size:12px;color:var(--sub)}
.link .ttl{font-weight:700;margin:6px 0 2px}
.link .sum{font-size:14px}
.link .sum.empty{color:var(--sub);font-style:italic}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:14px;color:var(--ink);background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.embed{margin-top:10px}
.check label{display:flex;gap:10px;align-items:center;padding:9px 0;font-size:15px}
.check label+label{border-top:1px dashed var(--line)}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.check input:checked+span{text-decoration:line-through;color:var(--sub)}
.count{color:var(--sub);font-size:13px;margin:0 0 8px}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<header>
  <div class="txt">
    <div class="kicker">TOKYO · HAKONE 2026</div>
    <h1 id="title">류씨가족 일본여행</h1>
    <p id="subtitle"></p>
    <div id="dday"></div>
  </div>
  <svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <circle cx="300" cy="52" r="26" fill="#ffd27a" opacity=".95"/>
    <path d="M0 120 L120 34 Q132 26 144 34 L270 120 Z" fill="#3d4f7c"/>
    <path d="M108 43 L120 34 Q132 26 144 34 L156 43 L146 48 L138 42 L130 49 L121 42 L113 48 Z" fill="#fff"/>
    <path d="M150 120 L250 70 L400 120 Z" fill="#2c3a5e" opacity=".9"/>
    <g fill="#c8102e">
      <rect x="318" y="66" width="62" height="6" rx="2"/>
      <rect x="322" y="76" width="54" height="4"/>
      <rect x="328" y="72" width="5" height="48"/>
      <rect x="365" y="72" width="5" height="48"/>
    </g>
    <path d="M0 120 L0 108 Q60 98 120 106 T240 104 T400 106 L400 120 Z" fill="var(--bg)"/>
  </svg>
</header>
<nav>
  <button data-tab="plan" class="on">일정</button>
  <button data-tab="entry">입국</button>
  <button data-tab="food">맛집</button>
  <button data-tab="shop">쇼핑</button>
  <button data-tab="taxfree">면세</button>
  <button data-tab="links">링크</button>
  <button data-tab="pack">준비물</button>
  <button data-tab="parking">주차</button>
  <button data-tab="tools">도구</button>
</nav>
<main>
  <section id="plan" class="on"></section>
  <section id="entry"></section>
  <section id="food"></section>
  <section id="shop"></section>
  <section id="taxfree"></section>
  <section id="links"></section>
  <section id="pack"></section>
  <section id="parking"></section>
  <section id="tools"></section>
  <footer id="foot"></footer>
</main>
<div id="big" role="dialog"><div class="ja"></div><div class="ko"></div><p class="count" style="margin-top:24px">화면을 누르면 닫혀요</p></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
const TYPE = {instagram:"인스타", youtube:"유튜브", blog:"블로그", chatgpt:"ChatGPT", web:"웹"};

const TABS = [...document.querySelectorAll("nav button")].map(b => b.dataset.tab);
function showTab(tab){
  if (!TABS.includes(tab)) tab = "plan";
  document.querySelectorAll("nav button,section").forEach(x => x.classList.remove("on"));
  document.querySelector(`nav button[data-tab="${tab}"]`).classList.add("on"); $("#" + tab).classList.add("on");
  store.set("tab", tab); scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  if (location.hash.slice(1) === b.dataset.tab) return;
  history.pushState({tab: b.dataset.tab}, "", "#" + b.dataset.tab);
  showTab(b.dataset.tab);
});
// 뒤로가기: 큰 글씨 카드가 열려 있으면 닫고, 아니면 이전 탭으로
addEventListener("popstate", () => {
  const big = document.getElementById("big");
  if (big && big.classList.contains("on")) { big.classList.remove("on"); return; }
  showTab(location.hash.slice(1) || "plan");
});
{
  const start = location.hash.slice(1) || store.get("tab", "plan");
  history.replaceState({tab: start}, "", "#" + (TABS.includes(start) ? start : "plan"));
  showTab(start);
}

function todayStr(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function renderTrip(t){
  $("#title").textContent = t.title; $("#subtitle").textContent = t.subtitle;
  const start = new Date(t.days[0].date + "T00:00:00"), now = new Date(todayStr() + "T00:00:00");
  const diff = Math.round((start - now) / 864e5), last = new Date(t.days.at(-1).date + "T00:00:00");
  $("#dday").textContent = diff > 0 ? `D-${diff}` : now <= last ? `여행 ${1 - diff}일차` : "다녀왔어요";

  const today = todayStr();
  let h = `<div class="card nowwx" id="nowwx"><p class="count">지금 도쿄 날씨 불러오는 중…</p></div>`;
  h += `<div class="card"><h2>항공</h2>` + t.flights.map(f => `
    <div class="row"><div class="k">${esc(f.label)}<br>${esc(f.date.slice(5).replace("-","/"))}</div>
    <div class="v"><div class="flight"><div><b>${esc(f.dep)}</b><br>${esc(f.from)}</div>
    <div class="mid">${esc(f.airline)} ${esc(f.no)}</div><div style="text-align:right"><b>${esc(f.arr)}</b><br>${esc(f.to)}</div></div></div></div>`).join("") + `</div>`;
  h += `<div class="card"><h2>미팅 · 숙소 · 가이드</h2>
    <div class="row"><div class="k">미팅</div><div class="v"><b>${esc(t.meeting.time)}</b> ${esc(t.meeting.place)}<br><small style="color:var(--sub)">${esc(t.meeting.note)}</small></div></div>
    <div class="row"><div class="k">호텔</div><div class="v">${esc(t.hotel.name)} · <a href="route.html">전망대→호텔 가는 법</a> · <a href="https://www.google.com/maps/search/${encodeURIComponent(t.hotel.name)}" target="_blank" rel="noopener">지도</a><br><small style="color:var(--sub)">${esc(t.hotel.note)}</small></div></div>
    <div class="row"><div class="k">가이드</div><div class="v">${esc(t.guide.name)}${t.guide.phone ? ` · <a href="tel:${esc(t.guide.phone.replace(/-/g,""))}">${esc(t.guide.phone)}</a>` : ""}<br><small style="color:var(--sub)">${esc(t.guide.note)}</small></div></div>
    <div class="row"><div class="k">인원</div><div class="v">${esc(t.people)}</div></div>
    <div class="row"><div class="k">날씨</div><div class="v">${esc(t.weather)}</div></div></div>`;
  if (t.wifi) h += infoCard(t.wifi);
  h += t.days.map(d => `<div class="card day ${d.date === today ? "today" : ""}">
    <div class="head"><h2>${d.day}일차 · ${esc(d.title)}</h2><span>${esc(d.date.slice(5).replace("-","/"))} (${esc(d.dow)})</span></div>
    ${d.items.map(i => `<div class="item ${i.pending ? "pending" : ""} ${i.note ? "sub" : ""}"><div class="t">${esc(i.time || "")}</div><div>${i.link ? `<a href="${esc(i.link)}">${esc(i.text)}</a>` : esc(i.text)}</div></div>`).join("")}
    ${d.meals ? `<div class="meals">🍽 ${esc(d.meals)}</div>` : ""}
  </div>`).join("");
  h += t.notes.map(n => `<div class="note">${esc(n)}</div>`).join("");
  h += `<div class="btns"><a class="btn" href="${esc(t.productUrl)}" target="_blank" rel="noopener">여행사 일정표 원본 보기</a></div>`;
  $("#plan").innerHTML = h;

  const done = store.get("pack", {});
  const box = $("#pack");
  const draw = () => {
    const n = t.checklist.filter(c => done[c]).length;
    box.innerHTML = `<div class="card check"><h2>준비물</h2><p class="count">${n} / ${t.checklist.length} 챙김 · 이 폰에만 저장돼요</p>` +
      t.checklist.map((c, i) => `<label><input type="checkbox" data-i="${i}" ${done[c] ? "checked" : ""}><span>${esc(c)}</span></label>`).join("") + `</div>`;
    box.querySelectorAll("input").forEach(el => el.onchange = () => { done[t.checklist[el.dataset.i]] = el.checked; store.set("pack", done); draw(); });
  };
  draw();
}

function infoCard(o){
  return `<div class="card"><h2>${esc(o.title)}</h2>${o.rows.map(r => `<div class="row"><div class="k">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`).join("")}
    ${o.tip ? `<div class="note" style="margin:10px 0 0">${esc(o.tip)}</div>` : ""}
    ${o.links ? `<div class="btns">${o.links.map(l => `<a class="btn" href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join("")}</div>` : ""}
    ${o.source ? `<p class="count" style="margin-top:8px">${esc(o.source)}</p>` : ""}</div>`;
}
function renderParking(pk){
  const spot = store.get("parkSpot", "");
  $("#parking").innerHTML = `<div class="note">${esc(pk.intro)}</div>` +
    pk.options.map(o => `<div class="card"><h2>${esc(o.name)}</h2>
      <div class="row"><div class="k">요금</div><div class="v">${esc(o.fee)}</div></div>
      <div class="row"><div class="k">예상</div><div class="v"><b>${esc(o.est)}</b></div></div>
      <div class="row"><div class="k">참고</div><div class="v">${esc(o.note)}</div></div></div>`).join("") +
    `<div class="card"><h2>내 차 위치 메모</h2><div class="fx"><input id="parkSpot" placeholder="예: 장기 P1 B구역 23번" value="${esc(spot)}" maxlength="80"></div><p class="count" style="margin-top:6px">입력하면 이 폰에 바로 저장돼요</p></div>` +
    `<div class="card"><h2>알아두기</h2><ul class="tipl">${pk.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <div class="btns"><a class="btn primary" href="https://www.google.com/maps/search/${encodeURIComponent("인천공항 제1터미널 장기주차장")}" target="_blank" rel="noopener">장기주차장 길찾기</a><a class="btn" href="https://www.airport.kr" target="_blank" rel="noopener">인천공항 홈페이지</a></div></div>` +
    `<div class="card link"><div class="top"><span class="badge b-blog">블로그</span><span class="meta">가족이 보낸 링크</span></div><div class="ttl">${esc(pk.blog.title)}</div><div class="sum empty">${esc(pk.blog.note)}</div><div class="btns"><a class="btn primary" href="${esc(pk.blog.url)}" target="_blank" rel="noopener">열기</a></div></div>` +
    `<p class="count">${esc(pk.sources)}</p>`;
  $("#parkSpot").oninput = e => store.set("parkSpot", e.target.value);
}

function hourT(r, date, hh){
  if (!r.hourly) return "-";
  const i = r.hourly.time.indexOf(`${date}T${String(hh).padStart(2, "0")}:00`);
  return i < 0 || r.hourly.temperature_2m[i] == null ? "-" : Math.round(r.hourly.temperature_2m[i]) + "°";
}
function loadNow(t){
  const today = t.days.find(d => d.date === todayStr());
  const pl = today && today.day === 3 && t.weatherPlaces[1] ? t.weatherPlaces[1] : t.weatherPlaces[0];
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pl.lat}&longitude=${pl.lon}&current=temperature_2m,apparent_temperature,weather_code&hourly=temperature_2m&timezone=Asia%2FTokyo&forecast_days=1`)
    .then(r => r.json()).then(r => {
      if (!r.current) throw 0;
      const d = r.current.time.slice(0, 10), hm = r.current.time.slice(11, 16);
      $("#nowwx").innerHTML = `<div class="nowrow"><div class="big">${WMO(r.current.weather_code)} ${Math.round(r.current.temperature_2m)}°</div>
        <div><div class="nm">지금 ${esc(pl.name.split(" ")[0])} 날씨</div><div class="count" style="margin:0">체감 ${Math.round(r.current.apparent_temperature)}° · 일본 시간 ${hm}</div></div></div>
        <div class="hh"><div><span>오늘 12시경</span><b>${hourT(r, d, 12)}</b></div><div><span>오늘 20시경</span><b>${hourT(r, d, 20)}</b></div></div>`;
    }).catch(() => { $("#nowwx").innerHTML = `<p class="count">지금 날씨를 못 불러왔어요. 인터넷 연결을 확인해 주세요.</p>`; });
}

function renderFood(f){
  const order = [...f.days].sort((a, b) => (a.day || 9) - (b.day || 9));
  $("#food").innerHTML = `<div class="note">${esc(f.intro)}</div>` + order.map(d => `<div class="card">
    <h2>${d.day ? d.day + "일차 저녁 · " : ""}${esc(d.area)}</h2>
    ${d.spots.map(s => `<div class="spot"><div style="flex:1"><div class="nm">${esc(s.name)} <span class="tag">${esc(s.tag)}</span></div><div class="wh">${esc(s.what)}</div></div>
      <a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent(s.q)}">지도</a></div>`).join("")}
  </div>`).join("");
}
function renderShop(sh){
  const done = store.get("shop", {}), mine = store.get("shopMine", []);
  const box = $("#shop");
  const draw = () => {
    const all = sh.groups.flatMap(g => g.items).concat(mine);
    const n = all.filter(i => done[i]).length;
    let h = `<a class="note" href="#taxfree" style="display:block;text-decoration:none">면세 받는 방법은 <b>면세</b> 탭에 정리했어요 →</a>`;
    h += `<p class="count">살 것 ${n} / ${all.length} 체크 · 이 폰에만 저장돼요</p>`;
    h += sh.groups.map(g => `<div class="card check"><h2>${esc(g.name)}</h2>${g.items.map(i => `<label><input type="checkbox" data-k="${esc(i)}" ${done[i] ? "checked" : ""}><span>${esc(i)}</span></label>`).join("")}</div>`).join("");
    h += `<div class="card check"><h2>내가 추가한 것</h2>${mine.map((i, x) => `<label><input type="checkbox" data-k="${esc(i)}" ${done[i] ? "checked" : ""}><span>${esc(i)}</span><button class="del" data-x="${x}" aria-label="삭제">×</button></label>`).join("") || '<p class="count">아직 없어요</p>'}
      <div class="addrow"><input id="newItem" placeholder="예: 동전파스, 곤약젤리" maxlength="60"><button id="addItem">추가</button></div></div>`;
    box.innerHTML = h;
    box.querySelectorAll("input[data-k]").forEach(el => el.onchange = () => { done[el.dataset.k] = el.checked; store.set("shop", done); draw(); });
    box.querySelectorAll(".del").forEach(b => b.onclick = e => { e.preventDefault(); mine.splice(+b.dataset.x, 1); store.set("shopMine", mine); draw(); });
    const add = () => { const v = $("#newItem").value.trim(); if (v && !mine.includes(v)) { mine.push(v); store.set("shopMine", mine); } draw(); };
    $("#addItem").onclick = add; $("#newItem").onkeydown = e => { if (e.key === "Enter") add(); };
  };
  draw();
}

const WMO = c => c === 0 ? "☀️" : c <= 2 ? "🌤️" : c === 3 ? "☁️" : c <= 48 ? "🌫️" : c <= 67 ? "🌧️" : c <= 77 ? "🌨️" : c <= 82 ? "🌦️" : "⛈️";
function renderTools(t){
  const won = n => Math.round(n).toLocaleString("ko-KR");
  let rate = store.get("rate", null);
  const em = t.emergency.map(e => `<a href="tel:${esc(e.num.replace(/[^+\d]/g, ""))}"><span>${esc(e.name)}</span><b>${esc(e.num)}</b></a>`).join("");
  const ph = t.phrases.map((p, i) => `<div class="ph" data-i="${i}"><div class="ko">${esc(p[0])}</div><div class="ja">${esc(p[1])}</div><div class="rd">${esc(p[2])}</div></div>`).join("");
  $("#tools").innerHTML = `
  <div class="card"><h2>여행 기간 날씨</h2><div id="wx"><p class="count">불러오는 중…</p></div></div>
  <div class="card"><h2>환율 계산기</h2>
    <div class="fx"><input id="jpy" type="number" inputmode="decimal" placeholder="엔"><span>¥</span></div>
    <div class="fx" style="margin-top:8px"><input id="krw" type="number" inputmode="decimal" placeholder="원"><span>₩</span></div>
    <div class="quick">${[100, 500, 1000, 3000, 5000, 10000].map(v => `<button data-y="${v}">${v.toLocaleString()}엔</button>`).join("")}</div>
    <p class="count" id="rateInfo" style="margin-top:8px"></p></div>
  <div class="card"><h2>경비 장부</h2>
    <div class="fx"><input id="exWho" placeholder="누가" style="flex:.6"><input id="exWhat" placeholder="뭐에"></div>
    <div class="fx" style="margin-top:8px"><input id="exAmt" type="number" inputmode="numeric" placeholder="엔 금액"><button class="btn primary" id="exAdd" style="flex:none;padding:10px 16px">추가</button></div>
    <div id="exList"></div><p class="count">이 폰에만 저장돼요. 가족 공유는 안 돼요.</p></div>
  <div class="card em"><h2>비상 연락처 (누르면 전화)</h2>${em}</div>
  ${t.insurance ? infoCard(t.insurance) : ""}
  <div class="card"><h2>일본어 카드 (누르면 크게 보여요)</h2>${ph}</div>`;

  // exchange
  const jpy = $("#jpy"), krw = $("#krw"), info = $("#rateInfo");
  const showRate = () => info.textContent = rate ? `100엔 = 약 ${won(rate.v * 100)}원 (${rate.d} 기준)` : "환율을 못 불러왔어요. 인터넷 연결 후 다시 열어 주세요.";
  jpy.oninput = () => { if (rate) krw.value = jpy.value ? Math.round(jpy.value * rate.v) : ""; };
  krw.oninput = () => { if (rate) jpy.value = krw.value ? Math.round(krw.value / rate.v) : ""; };
  document.querySelectorAll(".quick button").forEach(b => b.onclick = () => { jpy.value = b.dataset.y; jpy.oninput(); });
  showRate();
  fetch("https://open.er-api.com/v6/latest/JPY").then(r => r.json()).then(j => {
    if (j && j.rates && j.rates.KRW) { rate = {v: j.rates.KRW, d: new Date().toLocaleDateString("ko-KR")}; store.set("rate", rate); showRate(); jpy.oninput(); }
  }).catch(() => {});

  // ledger
  const ex = store.get("expenses", []);
  const drawEx = () => {
    const tot = ex.reduce((a, e) => a + e.y, 0), by = {};
    ex.forEach(e => by[e.who || "-"] = (by[e.who || "-"] || 0) + e.y);
    const r = rate ? rate.v : 0;
    $("#exList").innerHTML = ex.length ? `<table class="ledger">${ex.map((e, i) => `<tr><td>${esc(e.who)}</td><td>${esc(e.what)}</td><td class="r">¥${e.y.toLocaleString()}</td><td class="r"><button class="del" data-i="${i}" aria-label="삭제">×</button></td></tr>`).join("")}
      <tr><td colspan="2"><b>합계</b> ${Object.entries(by).map(([k, v]) => `<span class="tag">${esc(k)} ¥${v.toLocaleString()}</span>`).join("")}</td><td class="r"><b>¥${tot.toLocaleString()}</b>${r ? `<br><small>약 ${won(tot * r)}원</small>` : ""}</td><td></td></tr></table>` : `<p class="count" style="margin-top:8px">아직 기록이 없어요</p>`;
    $("#exList").querySelectorAll(".del").forEach(b => b.onclick = () => { ex.splice(+b.dataset.i, 1); store.set("expenses", ex); drawEx(); });
  };
  $("#exWho").value = store.get("lastWho", "");
  $("#exAdd").onclick = () => {
    const y = Math.round(+$("#exAmt").value); if (!y) return;
    const who = $("#exWho").value.trim(); store.set("lastWho", who);
    ex.push({who, what: $("#exWhat").value.trim(), y}); store.set("expenses", ex);
    $("#exWhat").value = ""; $("#exAmt").value = ""; drawEx();
  };
  drawEx();

  // phrases
  const big = $("#big");
  document.querySelectorAll(".ph").forEach(el => el.onclick = () => { const p = t.phrases[el.dataset.i]; big.querySelector(".ja").textContent = p[1]; big.querySelector(".ko").textContent = p[0]; big.classList.add("on"); history.pushState({big: 1}, "", location.hash); });
  big.onclick = () => history.back();

  // weather
  const s0 = t.days[0].date, s1 = t.days.at(-1).date;
  Promise.all(t.weatherPlaces.map(pl => fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pl.lat}&longitude=${pl.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=temperature_2m&timezone=Asia%2FTokyo&start_date=${s0}&end_date=${s1}`).then(r => r.json())))
  .then(rs => {
    $("#wx").innerHTML = rs.map((r, k) => !r.daily ? "" : `<p class="count" style="margin:8px 0 6px">${esc(t.weatherPlaces[k].name)}</p><div class="wx">${r.daily.time.map((d, i) => `<div><span class="t">${d.slice(5).replace("-", "/")}</span><b>${WMO(r.daily.weather_code[i])}</b>${Math.round(r.daily.temperature_2m_min[i])}° / ${Math.round(r.daily.temperature_2m_max[i])}°<br>☂ ${r.daily.precipitation_probability_max[i] ?? "-"}%<br><small>12시 ${hourT(r, d, 12)}<br>20시 ${hourT(r, d, 20)}</small></div>`).join("")}</div>`).join("")
      + `<p class="count" style="margin-top:8px">Open-Meteo 예보 · 열 때마다 새로 받아요</p>`;
    if (!rs.some(r => r.daily)) throw 0;
  }).catch(() => { $("#wx").innerHTML = `<p class="count">예보를 아직 못 받았어요 (여행 16일 전부터 나와요). 가이드 안내: ${esc(t.weather)}</p>`; });
}

let LINKS = [], GROUPS = [], filter = store.get("gfilter", "all");
function linkCard(l){
  const sum = l.summary ? `<div class="sum">${esc(l.summary)}</div>` : `<div class="sum empty">아직 내용을 확인하지 못했어요. 링크를 열어 확인해 주세요.</div>`;
  const preview = l.type === "instagram" ? `<button class="btn" data-embed="${esc(l.url)}">여기서 미리보기</button>` : "";
  return `<div class="card link">
    <div class="top"><span class="badge b-${esc(l.type)}">${esc(TYPE[l.type] || l.type)}</span><span class="meta">${esc(l.from)} · ${esc(l.sent)}</span></div>
    ${l.title ? `<div class="ttl">${esc(l.title)}</div>` : ""}
    ${sum}
    <div>${(l.tags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</div>
    <div class="btns">${preview}<a class="btn primary" href="${esc(l.url)}" target="_blank" rel="noopener">열기</a></div>
    <div class="embed"></div></div>`;
}
function chipName(g, all){
  const [a, b] = g.split(" · ");
  return b && all.filter(x => x.split(" · ")[0] === a).length > 1 ? b.split("/")[0] : a;
}
function renderTaxfree(sh){
  const items = LINKS.filter(l => l.group === "면세").slice().reverse();
  $("#taxfree").innerHTML = `<div class="card steps-tf"><h2>바뀐 면세 환급 방법</h2>${sh.taxfree.map((t, i) => `<p${i === sh.taxfree.length - 1 ? ' style="color:var(--accent);font-weight:700"' : ""}>${esc(t)}</p>`).join("")}<p class="count" style="margin-top:8px">${esc(sh.taxfreeNote)}</p></div>
    <h3 class="ghead">면세 참고 링크 <span>${items.length}</span></h3>` + items.map(linkCard).join("");
  bindEmbeds($("#taxfree"));
}
function bindEmbeds(root){
  root.querySelectorAll("[data-embed]").forEach(b => b.onclick = () => {
    const slot = b.closest(".card").querySelector(".embed");
    slot.innerHTML = `<blockquote class="instagram-media" data-instgrm-permalink="${b.dataset.embed}" data-instgrm-version="14" style="width:100%;margin:0"></blockquote>`;
    b.remove();
    if (window.instgrm) instgrm.Embeds.process();
    else { const s = document.createElement("script"); s.src = "https://www.instagram.com/embed.js"; s.async = true; document.body.appendChild(s); }
  });
}

function renderEntry(v){
  const nara = (window.LINKS_ALL || []).filter(l => l.key === "ig:DeMlN2YPB4f");
  const li = a => `<ul class="tipl">${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  $("#entry").innerHTML = `<div class="note">${esc(v.intro)}</div>
    <div class="btns" style="margin:0 0 12px"><a class="btn primary" href="${esc(v.url)}" target="_blank" rel="noopener">공식 안내 (한국어)</a>${v.loginUrl ? `<a class="btn" href="${esc(v.loginUrl)}" target="_blank" rel="noopener">바로 등록·로그인</a>` : ""}</div>
    <div class="card"><h2>우리 가족이 입력할 내용</h2>${v.fill.map(r => `<div class="row"><div class="k">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`).join("")}
      <p class="count" style="margin-top:6px">숙소 주소를 길게 누르면 복사할 수 있어요</p></div>
    <div class="card"><h2>준비물</h2>${li(v.prep)}</div>
    <div class="card"><h2>등록 순서</h2>${v.steps.map((s, i) => `<div class="row"><div class="k"><b>${i + 1}</b></div><div class="v"><b>${esc(s[0])}</b><br><span style="font-size:14px;color:var(--sub)">${esc(s[1])}</span></div></div>`).join("")}</div>
    <div class="card"><h2>나리타 공항에서</h2>${v.airport.map((s, i) => `<div class="row"><div class="k"><b>${i + 1}</b></div><div class="v">${esc(s)}</div></div>`).join("")}</div>
    <div class="card"><h2>팁</h2>${li(v.tips)}</div>
    ${nara.length ? `<h3 class="ghead">가족이 보낸 입국 관련 링크</h3>` + nara.map(linkCard).join("") : ""}
    <p class="count">${esc(v.note)}</p>`;
  bindEmbeds($("#entry"));
}

function renderLinks(){
  const groupOf = l => l.group || "미분류";
  const LINKS = window.LINKS_ALL.filter(l => l.group !== "면세");
  const used = GROUPS.filter(g => LINKS.some(l => groupOf(l) === g));
  LINKS.forEach(l => { if (!used.includes(groupOf(l))) used.push(groupOf(l)); });
  if (filter !== "all" && !used.includes(filter)) filter = "all";
  let h = `<div class="chips"><button data-f="all" class="${filter === "all" ? "on" : ""}">전체 ${LINKS.length}</button>` +
    used.map(g => `<button data-f="${esc(g)}" class="${g === filter ? "on" : ""}">${esc(chipName(g, used))} ${LINKS.filter(l => groupOf(l) === g).length}</button>`).join("") + `</div>`;
  h += `<p class="count">가족이 보낸 링크 · 중복 제거됨 · 내용별로 묶음<br>인스타 요약은 게시물 글(캡션) 기준이에요. 영상 속 내용은 열어서 확인하세요.</p>`;
  for (const g of (filter === "all" ? used : [filter])) {
    const items = LINKS.filter(l => groupOf(l) === g).slice().reverse();
    h += `<h3 class="ghead">${esc(g)} <span>${items.length}</span></h3>` + items.map(linkCard).join("");
  }
  $("#links").innerHTML = h;
  $("#links").querySelectorAll(".chips button").forEach(b => b.onclick = () => { filter = b.dataset.f; store.set("gfilter", filter); renderLinks(); });
  $("#links").querySelectorAll("[data-embed]").forEach(b => b.onclick = () => {
    const slot = b.closest(".card").querySelector(".embed");
    slot.innerHTML = `<blockquote class="instagram-media" data-instgrm-permalink="${b.dataset.embed}" data-instgrm-version="14" style="width:100%;margin:0"></blockquote>`;
    b.remove();
    if (window.instgrm) instgrm.Embeds.process();
    else { const s = document.createElement("script"); s.src = "https://www.instagram.com/embed.js"; s.async = true; document.body.appendChild(s); }
  });
}

Promise.all([
  fetch("trip.json", {cache: "no-cache"}).then(r => r.json()),
  fetch("links.json", {cache: "no-cache"}).then(r => r.json())
]).then(([trip, links]) => {
  renderTrip(trip); if (trip.food) renderFood(trip.food); if (trip.shopping) renderShop(trip.shopping); if (trip.emergency) renderTools(trip); loadNow(trip); if (trip.parking) renderParking(trip.parking); LINKS = links.links; window.LINKS_ALL = LINKS; GROUPS = (links.groups || []).filter(g => g !== "면세"); renderLinks(); if (trip.shopping) renderTaxfree(trip.shopping); if (trip.vjw) renderEntry(trip.vjw);
  $("#foot").textContent = `링크 ${LINKS.length}개 (면세 ${LINKS.filter(l => l.group === "면세").length}개 포함)`;
}).catch(e => { $("#plan").innerHTML = `<div class="note">데이터를 불러오지 못했어요: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
